<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a0f00" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>던전 수호자</title>
    <style>
      :root {
        --sat: env(safe-area-inset-top,    0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left,   0px);
        --sar: env(safe-area-inset-right,  0px);
        --native-safe-top: 0px;
        --native-safe-bottom: 0px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: #1a0f00;
        width: 100%; height: 100%;
        overflow: hidden;
        /* prevent iOS rubber-band scroll */
        overscroll-behavior: none;
        touch-action: none;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        /* Keep the game canvas out of the notch/Dynamic Island and home bar.
           Phaser FIT mode scales into the padded box, so scenes don't need
           per-element safe-area offsets. */
        padding-top: max(var(--sat), var(--native-safe-top));
        padding-bottom: max(var(--sab), var(--native-safe-bottom));
        padding-left: var(--sal);
        padding-right: var(--sar);
      }
      canvas { display: block; touch-action: none; }
      /* Sized by body's content box (padding excluded) — Phaser FIT measures
         this element, so the canvas always lands inside the safe area. */
      #game-root {
        width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
